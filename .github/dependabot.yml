version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      site:
        patterns: ["*"]
