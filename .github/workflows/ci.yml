name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["**"] # a tag runs only release.yml
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: "Every commit is type(scope): summary"
        run: |
          bad=$(git log --no-merges --format=%s ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | grep -v -E '^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9._/-]+\))?!?: .+' || true)
          test -z "$bad" || { printf 'Not Conventional Commits:\n%s\n' "$bad"; exit 1; }

  rust:
    name: Rust (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  desktop:
    name: Desktop app (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ui/src-tauri
      - name: Install dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Check and test
        working-directory: ui
        run: pnpm check && pnpm test && pnpm build
      - name: Build the CLI for the bridge tests
        run: cargo build --locked --release --workspace
      - name: Bridge tests
        env:
          TRACEWISE_BIN: ${{ github.workspace }}/target/release/tracewise
        run: cargo test --locked --manifest-path ui/src-tauri/Cargo.toml

  portability:
    name: Build check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows joins when its port is built; today several crates use Unix-only APIs
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace
