[package]
name = "tracewise"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tracewise"
path = "src/lib.rs"

[[bin]]
name = "tracewise"
path = "src/bin/tracewise.rs"

[dependencies]
tracewise-core = { path = "../tracewise-core" }
tracewise-git = { path = "../tracewise-git" }
tracewise-proc = { path = "../tracewise-proc" }
tracewise-shell = { path = "../tracewise-shell" }
tracewise-shim = { path = "../tracewise-shim" }
tracewise-platform = { path = "../tracewise-platform" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
ulid = { workspace = true }
toml = { workspace = true }

[features]
default = []
platform-stub = ["tracewise-platform/platform-stub"]

[dev-dependencies]
tempfile = { workspace = true }
tracewise-watch = { path = "../tracewise-watch" }
