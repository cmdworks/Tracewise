[workspace]
members = [
    "crates/*",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Asmat"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ignore = "0.4"
tempfile = "3.17"
blake3 = "1.5"
zstd = "0.14"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
ulid = "3.0"
chrono = { version = "0.4", default-features = false, features = ["serde", "now", "std"] }
similar = "3.2"
notify = "8.2"
sha1 = "0.11"
flate2 = "1.0"
libc = "0.2"
ed25519-dalek = "3.0"
getrandom = "0.4"
chacha20poly1305 = "0.11"
toml = { version = "1.2", default-features = false, features = ["parse"] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true

