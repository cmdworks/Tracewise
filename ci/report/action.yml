name: Tracewise report
description: Verify the Tracewise history of this repository and add who-changed-what to the job summary.
inputs:
  since:
    description: Only changes since this duration (for example 7d). Empty means all.
    default: ""
runs:
  using: composite
  steps:
    - shell: sh
      run: |
        if [ -n "${{ inputs.since }}" ]; then "${{ github.action_path }}/ci-report.sh" --since "${{ inputs.since }}"; else "${{ github.action_path }}/ci-report.sh"; fi
